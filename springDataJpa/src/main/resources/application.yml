spring:
  datasource:
    url: jdbc:h2:tcp://localhost/~/datajpa
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 2000
        one-indexed-parameters: true

logging:
  level:
    org.hibernate.sql: debug
server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs  # OpenAPI 문서 경로
  swagger-ui:
    enabled: true
    path: /swagger-ui.html  # Swagger UI 경로
    url: /api-docs.yaml  # OpenAPI yaml 파일 경로 설정

